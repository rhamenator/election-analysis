[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "precinct-election-analysis"
version = "0.2.0"
description = "Exploratory, precinct-level election data validation and anomaly analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dashboard = ["folium>=0.15", "plotly>=5.18", "streamlit>=1.35"]
spatial = ["esda>=2.6", "geopandas>=0.14", "libpysal>=4.9"]
llm = ["openai>=2,<3"]
mcp = ["mcp>=2,<3"]
dev = [
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "types-PyYAML>=6",
]

[project.scripts]
election-analysis-mcp = "src.mcp_server:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:joblib.numpy_pickle",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
